name: aligner-index-builder
channels:
  - conda-forge
  - bioconda
dependencies:
  # Workflow runtime.
  - snakemake >=8
  # SLURM executor plugin (used by workflow/profiles/slurm). Its dependencies,
  # incl. snakemake-executor-plugin-slurm-jobstep, come along automatically.
  - snakemake-executor-plugin-slurm
  - conda >=24.7.1
  - pandas
  - pyyaml
  - jsonschema

  # Analysis tools -- installed once at env creation so the workflow can be
  # run with plain `snakemake` (no --sdm conda needed, no per-run solves).
  # Version pins mirror workflow/default-config/versions.yaml; keep the two in
  # sync when bumping a tool.
  - star=2.7.11b
  # 1.22.1, not 1.23.1: STAR 2.7.11b (the final STAR release) pins
  # htslib <1.23, and samtools 1.23.x needs htslib >=1.23.1 -- so only
  # samtools up to 1.22.x can share an environment with STAR.
  - samtools=1.22.1
  - hisat2=2.2.1
  - bowtie2=2.5.5
  - bwa=0.7.18
  - bwa-mem2=2.2.1
  # 1.10.3, not >=1.10: salmon 2.x rewrote the index format (piscem/SSHash)
  # and no longer writes the classic seq.bin layout the workflow expects.
  - salmon=1.10.3
  # 0.25.1, not >=0.24.1: bioconda's bismark is now a 3.x Rust rewrite whose
  # CLI and output layout differ from the classic Perl bismark the workflow
  # expects. Classic bismark writes Bisulfite_Genome/CT_conversion/BS_CT.1.bt2
  # and takes --path_to_aligner (not --path_to_bowtie2).
  - bismark=0.25.1
  - bwameth
  - gffread >=0.12.6
  - ucsc-fatotwobit=482
  # Floor only: keeps the solver from backtracking to an ancient build.
  - python >=3.9
