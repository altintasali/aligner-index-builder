# =============================================================================
# BUILT-IN DEFAULT per-rule compute resources (threads / mem_mb / runtime).
# Loaded automatically; override for your own runs by adding a `resources:`
# block to the generated config (it deep-merges over this file) or via
# --snakemake-options '--default-resources threads=...'. Values are
# conservative middle-grounds for real (e.g. human/mouse) genomes; the tiny CI
# fixture runs comfortably under the default cores anyway.
# =============================================================================
resources:
  check_chrom_consistency: {threads: 1, mem_mb: 2000, runtime: 30}
  prepare_genome: {threads: 1, mem_mb: 2000, runtime: 30}
  prepare_gtf: {threads: 1, mem_mb: 2000, runtime: 30}
  fasta_fai: {threads: 1, mem_mb: 2000, runtime: 30}
  fasta_2bit: {threads: 1, mem_mb: 8000, runtime: 60}
  star: {threads: 8, mem_mb: 48000, runtime: 480}
  hisat2_splicesites: {threads: 1, mem_mb: 2000, runtime: 30}
  hisat2_exons: {threads: 1, mem_mb: 2000, runtime: 30}
  hisat2: {threads: 8, mem_mb: 204800, runtime: 240}
  bowtie2: {threads: 8, mem_mb: 16000, runtime: 240}
  bwa: {threads: 8, mem_mb: 16000, runtime: 240}
  # bwa-mem2 index peak RAM scales with genome size and threads; 32 GB is too
  # little for GRCm38/GRCh38 at 8 threads (bwa-mem2 exits 1 on allocation
  # failure instead of being OOM-killed). bwameth2 runs the same build.
  bwa_mem2: {threads: 8, mem_mb: 65536, runtime: 240}
  bwameth: {threads: 8, mem_mb: 16000, runtime: 240}
  bwameth2: {threads: 8, mem_mb: 65536, runtime: 240}
  bismark: {threads: 8, mem_mb: 16000, runtime: 240}
  transcriptome_fasta: {threads: 1, mem_mb: 4000, runtime: 30}
  salmon: {threads: 8, mem_mb: 16000, runtime: 120}
  # MultiQC report + its inputs (pipeline_info/ versions/ under outdir).
  software_versions: {threads: 1, mem_mb: 2000, runtime: 30}
  resources_used: {threads: 1, mem_mb: 2000, runtime: 60}
  config_used: {threads: 1, mem_mb: 2000, runtime: 30}
  benchmark_summary: {threads: 1, mem_mb: 2000, runtime: 30}
  multiqc: {threads: 1, mem_mb: 4000, runtime: 60}
