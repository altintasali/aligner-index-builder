# =============================================================================
# Custom MultiQC configuration, passed to every multiqc run via `-c`.
#
# aligner-index-builder has no per-sample data (no alignments/reads), so the
# report is entirely custom content: the "Resources used" / "Configuration
# used" / "Index sizes" / "Annotation summary" tables (emitted by the
# resources_used + config_used rules, qc.smk), the "Resource usage"
# benchmark summary (benchmark_summary rule), and the built-in "Software
# Versions" section (from the *_mqc_versions.yml written by the
# software_versions rule).
# =============================================================================
title: "aligner-index-builder"
comment: >-
  Auto-generated by the aligner-index-builder Snakemake workflow
  (STAR, HISAT2, bowtie2, bwa, bwa-mem2, bwameth/bwameth2, Bismark and
  salmon index sets built from a reference FASTA + optional GTF).

# The Software Versions section is discovered automatically from the
# *_mqc_versions.yml file; the rest of the report is custom content.
module_order:
  - custom_content
  - software_versions

# Order of the custom-content sections within the custom_content module;
# without this their order is arbitrary. Section ids come from the `_mqc.json`
# documents emitted by the resources_used / config_used / benchmark_summary
# rules. MultiQC silently skips ids that produced no data, so the ids are
# harmless when the corresponding stage is off (e.g. annotation_summary when
# no GTF was given).
custom_content:
  order:
    - resources_used
    - config_used
    - index_sizes
    - annotation_summary
    - gtf_features
    - gtf_chroms
    - gtf_tx_length
    - resource_usage
