# =============================================================================
# EXAMPLE config for aligner-index-builder.
#
# You normally never write this file by hand -- the CLI generates it for you
# into your output directory, so this template exists mainly as documentation
# of the keys the workflow understands:
#
#   workflow/scripts/aligner-index-builder \
#     --fasta genome.fa --gtf genes.gtf -o results/GRCh38
#
# For direct snakemake runs (advanced users / debugging), generate it with the
# CLI's --dry-run to see the file, or write one by hand and pass it with:
#
#   snakemake -s workflow/Snakefile --configfile path/to/config.yaml --cores N
#
# Paths are resolved against the directory you run snakemake from; the CLI
# writes them as absolute paths. `repo_root` (also written by the CLI) anchors
# the built-in workflow/default-config/{versions,resources}.yaml includes; if
# you hand-write a config, either set it or run snakemake from the repo root.
# `fasta` and `gtf` may be local paths (plain or gzipped) or
# http(s)/ftp(s)/file:// URLs.
# =============================================================================
genome_name: GRCh38          # name used for the generated config + manifest
outdir: results/GRCh38       # where all indices land (created if missing)
repo_root: /path/to/aligner-index-builder
fasta: /path/to/genome.fa    # or https://.../genome.fa.gz
gtf: /path/to/genes.gtf      # optional but required for star/hisat2/salmon
tools:                       # which indices to build ("all" = every tool)
  - star
  - hisat2
  - bowtie2
  - bwa
  - bwa-mem2
  - bwameth
  - bwameth2
  - salmon
  - bismark
star_extra: "--sjdbOverhang 100"  # extra STAR genomeGenerate flags
                             # default: "--sjdbOverhang 100"
                             # e.g. small genomes: "--sjdbOverhang 100
                             # --genomeSAindexNbases 7 --genomeChrBinNbits 16"
hisat2_extra: ""             # extra hisat2-build flags, e.g. "--bmax 4096"
bowtie2_extra: ""            # extra bowtie2-build flags, e.g. "--large-index"
bwa_extra: ""                # extra bwa index flags, e.g. "-a -6"
bwa_mem2_extra: ""           # extra bwa-mem2 index flags
bwameth_extra: ""            # extra bwameth.py index flags
bwameth2_extra: ""           # extra bwameth.py index-mem2 flags
salmon_extra: "-k 31"        # extra salmon index flags
                             # default: "-k 31"
bismark_extra: ""            # extra bismark_genome_preparation flags

# Chromosome filtering (optional -- applied by filter_genome before any index
# is built).  When none of these are set, the FASTA is used as-is.
# keep_chroms:                 # regex pattern(s) -- only keep matching contigs
#   - "^\\d+$"                #   (e.g. keep numeric contigs only)
# remove_nonstandard: true    # remove non-standard chromosomes
#   # keeps contigs matching ^(chr)?(\\d+|[XYWZ]|MT?)$ (case-insensitive)
# exclude_chroms:             # regex pattern(s) -- remove matching contigs
#   - "chrM"                  #   (e.g. drop mitochondrial contigs)
